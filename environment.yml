# Cross-platform CPU environment. Use environment-cuda.yml on NVIDIA systems.
name: meteor_detector
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - tk
  - numpy
  - pillow
  - astropy
  - matplotlib
  - requests
  - pip:
    - torch
    - torchvision
    - pyinstaller
    - opencv-python
    - tkinterdnd2
    - openai
    - transformers
    - qwen-vl-utils
    - accelerate
